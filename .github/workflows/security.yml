name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC: catches new advisories against an unchanged lockfile.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan pnpm-lock.yaml with OSV-Scanner
        # No floating v2 tag is published for this action; pinned to the latest v2 release.
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action needs a paid licence for organisation repositories;
      # the gitleaks CLI does not. Pinned release, checksum verified before use.
      - name: Install gitleaks 8.21.2
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan full history for committed secrets
        # .gitleaks.toml skips tests, fixtures and quarantined evidence (fake secrets by design);
        # .gitleaksignore lists reviewed false positives in published history.
        run: gitleaks git --redact --no-banner -c .gitleaks.toml .

  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check dependency licences (fails closed)
        run: pnpm licenses:check
