name: CI (CP0 Foundation)

on:
  # Full gate only where it matters: pull requests into main, and main itself after a merge.
  # Story branches get CI through their pull request, not on every push (saves Actions minutes).
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The gate is split into five parallel jobs. Together they run every check the old single
  # sequential `cp0` job ran (ci:cp4 -> cp0..cp3, then cp5..cp10 and mcp:budget), each exactly once:
  #   vitest (3 shards) - the full `vitest run` (workers, dom and node projects). It covers every
  #                       `vitest run <subset>` in ci:cp1..cp10 and the @poc/studio-web unit tests.
  #   e2e               - `pnpm ci:e2e`: the full Playwright suite (covers studio:a11y, the cp5..cp7
  #                       test:e2e subsets and sandbox-to-byoc), then studio:scorecard, which reads
  #                       its JSON report.
  #   gates             - `pnpm lint` (oxlint correctness), `pnpm lint:types` (type-aware oxlint on the money, auth
  #                       and deploy paths), `pnpm format:check` (Prettier), then `pnpm ci:gates`: lints, typecheck,
  #                       catalog, evidence, story and MCP gates.
  #                       Then the live-canary fetch (continue-on-error) and `pnpm ci:tiers`
  #                       (catalog:tiers), so evidence:check sees only committed evidence.
  #   proof             - `pnpm ci:proof`: boot, proof, restore drill and the studio/beta/sandbox gates.
  #   coverage          - `pnpm coverage:money` against its thresholds (money and auth code only), the coverage
  #                       table in the step summary, the json summary as an artifact, then `pnpm coverage:proof`.
  # `cp0` aggregates them. Branch protection requires a check named `cp0`; this job fails unless
  # every job above succeeded (cancelled or skipped counts as failure), so the required check
  # keeps blocking merges without a branch-protection change.

  vitest:
    name: vitest (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end even if another fails; any failed shard fails the job.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run vitest shard
        run: pnpm vitest run --shard=${{ matrix.shard }}/3

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full Playwright suite, then the parity scorecard
        run: pnpm ci:e2e

  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Evidence provenance cites earlier commits; evidence:check and stories:gate need them present.
          fetch-depth: 0

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run oxlint correctness gate
        run: pnpm lint

      # Type-aware rules (floating/misused promises, await-thenable, exhaustive switches) on the money, auth and deploy paths.
      - name: Run oxlint type-aware gate
        run: pnpm lint:types

      - name: Run Prettier format check
        run: pnpm format:check

      # Runs first so evidence:check validates only the committed evidence/ files.
      - name: Run lint, typecheck, catalog, evidence, story and MCP gates
        run: pnpm ci:gates

      # Must precede catalog:tiers (ci:tiers), which reads evidence/live-canary/.
      - name: Fetch live canary evidence
        run: |
          git fetch origin evidence/live-canary:evidence/live-canary 2>/dev/null || true
          git checkout evidence/live-canary -- evidence/live-canary/ 2>/dev/null || true
        continue-on-error: true

      - name: Run catalog tiers gate
        run: pnpm ci:tiers

  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run boot, proof, restore-drill and studio/beta/sandbox gates
        run: pnpm ci:proof

  # Coverage of the money and auth code only (credit-wallet, metered-usage, checkout-gateway, subscription-plans,
  # core-auth, llm-gateway, packages/gateway-adapters), separate from the vitest shards so they are unchanged.
  # vitest.coverage.config.ts holds the per-brick thresholds; with CI set, autoUpdate is off, so this job never rewrites
  # them and only fails when coverage drops below one. coverage:proof then shows a threshold failure fails a run.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run money and auth coverage against the thresholds
        run: pnpm coverage:money

      - name: Publish the coverage table to the step summary
        if: always()
        run: |
          if [ -f coverage/coverage-table.txt ]; then
            { echo "## Money and auth coverage"; echo; echo '```'; cat coverage/coverage-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage table was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Prove a threshold failure fails the run
        run: pnpm coverage:proof

  # The required check. Fails closed: passes only when every parallel job ended in success.
  # A matrix job's result is success only when all of its shards succeeded.
  cp0:
    needs: [vitest, e2e, gates, proof, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel job to succeed
        run: |
          for r in "${{ needs.vitest.result }}" "${{ needs.e2e.result }}" "${{ needs.gates.result }}" "${{ needs.proof.result }}" "${{ needs.coverage.result }}"; do
            [ "$r" = "success" ] || { echo "a required job ended: $r"; exit 1; }
          done
          echo "all parallel jobs succeeded"

  changes:
    name: Detect importer changes
    runs-on: ubuntu-latest
    outputs:
      importer: ${{ steps.filter.outputs.importer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Did importer or integration files change?
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "importer=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD | grep -E '^(packages/integrations|integrations|corpus)/' >/dev/null; then echo "importer=true" >> "$GITHUB_OUTPUT"; else echo "importer=false" >> "$GITHUB_OUTPUT"; fi

  fidelity:
    name: Importer Fidelity Regression Check
    needs: changes
    if: needs.changes.outputs.importer == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node.js >= 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache real-spec corpus
        uses: actions/cache@v6
        with:
          path: corpus/real-specs/.cache
          key: corpus-real-specs-${{ hashFiles('corpus/real-specs/manifest.json') }}

      - name: Fetch and verify corpus
        run: pnpm fidelity:fetch

      - name: Check importer fidelity against baseline
        run: pnpm fidelity:check
