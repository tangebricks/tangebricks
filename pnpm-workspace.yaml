packages:
  - apps/*
  - packages/*
  - bricks/*

# pnpm 10 skips dependency install scripts unless allowed; workerd and esbuild
# ship their native binary through one.
onlyBuiltDependencies:
  - esbuild
  - workerd

# lefthook's postinstall stays blocked: the root `prepare` script
# (scripts/install-hooks.mjs) installs the git hooks, outside CI only.
ignoredBuiltDependencies:
  - lefthook

# Security floors for transitive dependencies flagged by OSV-Scanner (2026-11-24):
# undici < 7.30.1 (via miniflare) and follow-redirects < 1.16.2 (via axios).
overrides:
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "follow-redirects@<1.16.2": "1.16.2"
